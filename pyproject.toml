[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-stethoscope"
version = "1.0.0"
description = "AI-assisted heart sound screening (murmur/normal/extrahls/artifact) on Raspberry Pi"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ahmed Darwish", email = "eahmeddarwish@gmail.com" }]

[project.scripts]
smart-stethoscope-gui = "smart_stethoscope.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
